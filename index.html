<!DOCTYPE html>
<html lang="es">
<head>
    <!-- Codificación para mostrar correctamente tildes y la letra ñ. -->
    <meta charset="UTF-8">
    <!-- Permite que el diseño se adapte al ancho de los dispositivos móviles. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Conoce el menú, los horarios y los datos de contacto del Restaurante Sabor Casero.">
    <title>Restaurante Sabor Casero</title>

    <!-- Ícono de la pestaña del navegador (está en la carpeta public/). -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <!-- Color de la barra del navegador en celulares Android. -->
    <meta name="theme-color" content="#843d29">

    <!-- Open Graph: título, texto e imagen que aparecen al compartir el enlace
         en WhatsApp, Facebook, etc. og:image debe ser una dirección completa (https://...).
         Cuando el sitio esté publicado, agrega también:
         <meta property="og:url" content="https://tu-dominio.com/"> -->
    <meta property="og:type" content="website">
    <meta property="og:locale" content="es_CO">
    <meta property="og:site_name" content="Restaurante Sabor Casero">
    <meta property="og:title" content="Restaurante Sabor Casero">
    <meta property="og:description" content="Comida casera para compartir en familia. Mira el menú y haz tu pedido por WhatsApp.">
    <meta property="og:image" content="https://images.unsplash.com/photo-1517248135467-4c7edcad34c4?auto=format&amp;fit=crop&amp;w=1200&amp;h=630&amp;q=80">
    <meta property="og:image:alt" content="Mesas y sillas en el interior de un restaurante">
    <!-- Lo mismo para X (Twitter): tarjeta con imagen grande. -->
    <meta name="twitter:card" content="summary_large_image">
</head>
<body>
    <!-- Aquí Vue dibuja toda la página (ver src/App.vue). -->
    <div id="app"></div>

    <!-- Si JavaScript está desactivado, se muestra al menos la información básica. -->
    <noscript>
        <p>Para ver el menú y hacer tu pedido, activa JavaScript en tu navegador.
           También puedes llamarnos al 300 300 3000 o visitarnos en la Calle 1 # 2 - 3.</p>
    </noscript>

    <script type="module" src="/src/main.js"></script>
</body>
</html>
